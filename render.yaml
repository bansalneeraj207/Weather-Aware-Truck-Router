services:
  - type: web
    name: weather-aware-truck-router-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 330
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PROVIDER_USER_AGENT
        sync: false
      - key: VALHALLA_CLIENT_ID
        sync: false

  - type: web
    name: weather-aware-truck-router
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
